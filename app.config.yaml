application:
  actions: actions
  web:
    src: web-src
  runtimeManifest:
    packages:
      genstudio-org-viewer:
        license: Apache-2.0
        actions:
          auth:
            function: actions/auth/index.js
            web: 'yes'
            runtime: nodejs:22
            limits:
              timeout: 10000
              memory: 1024
          set-password:
            function: actions/set-password/index.js
            web: 'yes'
            runtime: nodejs:22
            limits:
              timeout: 10000
              memory: 1024
          save-mapping:
            function: actions/save-mapping/index.js
            web: 'yes'
            runtime: nodejs:22
            limits:
              timeout: 10000
              memory: 1024
            inputs:
              AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
              AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
              AWS_REGION: $AWS_REGION
              AWS_BUCKET: $AWS_BUCKET
              OW_NAMESPACE: $AIO_runtime_namespace
              OW_AUTH: $AIO_runtime_auth
              GATE_ENABLED: $GATE_ENABLED
          load-mapping:
            function: actions/load-mapping/index.js
            web: 'yes'
            runtime: nodejs:22
            limits:
              timeout: 10000
              memory: 1024
            inputs:
              AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
              AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
              AWS_REGION: $AWS_REGION
              AWS_BUCKET: $AWS_BUCKET
              OW_NAMESPACE: $AIO_runtime_namespace
              OW_AUTH: $AIO_runtime_auth
              GATE_ENABLED: $GATE_ENABLED
          list-mappings:
            function: actions/list-mappings/index.js
            web: 'yes'
            runtime: nodejs:22
            limits:
              timeout: 10000
              memory: 1024
            inputs:
              AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
              AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
              AWS_REGION: $AWS_REGION
              AWS_BUCKET: $AWS_BUCKET
              OW_NAMESPACE: $AIO_runtime_namespace
              OW_AUTH: $AIO_runtime_auth
              GATE_ENABLED: $GATE_ENABLED
          delete-mapping:
            function: actions/delete-mapping/index.js
            web: 'yes'
            runtime: nodejs:22
            limits:
              timeout: 10000
              memory: 1024
            inputs:
              AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
              AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
              AWS_REGION: $AWS_REGION
              AWS_BUCKET: $AWS_BUCKET
              OW_NAMESPACE: $AIO_runtime_namespace
              OW_AUTH: $AIO_runtime_auth
              GATE_ENABLED: $GATE_ENABLED
